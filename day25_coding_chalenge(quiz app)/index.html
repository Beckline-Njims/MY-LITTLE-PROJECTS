<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz App</title>
    <style>
        body {
            font-family: Inter, system-ui;
            background: #071026;
            color: #eaf3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        .card {
            width: 100%;
            max-width: 720px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02)
        }

        h1 {
            margin: 0 0 12px
        }

        .question {
            font-size: 18px;
            margin-bottom: 10px
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .option {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer
        }

        .option.selected {
            background: rgba(255, 255, 255, 0.03)
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 12px
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Quiz App</h1>
        <div id="quiz-area">
            <div id="qno"></div>
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="footer">
                <button id="prev">Previous</button>
                <div>
                    <button id="submit">Submit</button>
                    <button id="next">Next</button>
                </div>
            </div>
        </div>
        <div id="result" style="display:none"></div>
    </div>

    <script>
        (() => {
            const data = [
                { q: 'What is HTML?', choices: ['Styling language', 'Markup language', 'Programming language', 'Database'], answer: 1 },
                { q: 'Which tag makes a link?', choices: ['<img>', '<a>', '<link>', '<href>'], answer: 1 },
                { q: 'CSS is used for?', choices: ['Structure', 'Behavior', 'Styling', 'Database'], answer: 2 },
                { q: 'JavaScript runs in?', choices: ['Browser', 'Printer', 'Database', 'OS only'], answer: 0 }
            ];

            let idx = 0;
            const answers = Array(data.length).fill(null);
            const qno = document.getElementById('qno');
            const question = document.getElementById('question');
            const options = document.getElementById('options');
            const prev = document.getElementById('prev');
            const next = document.getElementById('next');
            const submit = document.getElementById('submit');
            const result = document.getElementById('result');

            function render() {
                qno.textContent = `Question ${idx + 1} / ${data.length}`;
                question.textContent = data[idx].q;
                options.innerHTML = '';
                data[idx].choices.forEach((c, i) => {
                    const div = document.createElement('div'); div.className = 'option'; div.textContent = c;
                    if (answers[idx] === i) div.classList.add('selected');
                    div.addEventListener('click', () => {
                        answers[idx] = i;
                        render();
                    });
                    options.appendChild(div);
                });
                prev.disabled = idx === 0;
                next.disabled = idx === data.length - 1;
            }

            prev.addEventListener('click', () => { if (idx > 0) idx--; render() });
            next.addEventListener('click', () => { if (idx < data.length - 1) idx++; render() });
            submit.addEventListener('click', () => {
                if (answers.includes(null)) { if (!confirm('Some questions unanswered. Submit anyway?')) return; }
                let score = 0;
                for (let i = 0; i < data.length; i++) if (answers[i] === data[i].answer) score++;
                document.getElementById('quiz-area').style.display = 'none';
                result.style.display = 'block';
                result.innerHTML = `<h2>Result</h2><p>Score: ${score} / ${data.length}</p>
      <button id="retry">Retry</button>`;
                document.getElementById('retry').addEventListener('click', () => location.reload());
            });

            render();
        })();
    </script>
</body>

</html>
