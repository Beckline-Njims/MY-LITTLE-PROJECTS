<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f8f8f8;
        }

        .accordion {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .accordion-item {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: white;
            overflow: hidden;
        }

        .accordion-header {
            padding: 15px 20px;
            cursor: pointer;
            background-color: #222;
            color: #fff;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .accordion-header:hover {
            background-color: #444;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            background-color: #f1f1f1;
            transition: max-height 0.3s ease;
        }

        .accordion-content.open {
            padding: 20px;
            max-height: 200px;
            /* adjust based on content */
        }
    </style>
</head>

<body>

    <h2>Simple Accordion</h2>
    <div class="accordion">
        <div class="accordion-item">
            <div class="accordion-header">Section 1</div>
            <div class="accordion-content">This is the content of Section 1.</div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header">Section 2</div>
            <div class="accordion-content">This is the content of Section 2.</div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header">Section 3</div>
            <div class="accordion-content">This is the content of Section 3.</div>
        </div>
    </div>

    <script>
        const headers = document.querySelectorAll('.accordion-header');

        headers.forEach(header => {
            header.addEventListener('click', () => {
                const content = header.nextElementSibling;

                // Close any open sections
                document.querySelectorAll('.accordion-content').forEach(item => {
                    if (item !== content) {
                        item.classList.remove('open');
                    }
                });

                // Toggle the clicked section
                content.classList.toggle('open');
            });
        });
    </script>

</body>

</html>
