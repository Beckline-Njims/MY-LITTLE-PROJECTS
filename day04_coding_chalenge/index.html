<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tip Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tip Splitter App</h1>

    <label for="bill">Bill Amount (FCFA):</label>
    <input type="number" id="bill" placeholder="e.g. 10000">

    <label for="tip">Tip Percentage (%):</label>
    <input type="number" id="tip" placeholder="e.g. 10">

    <label for="people">Number of People:</label>
    <input type="number" id="people" placeholder="e.g. 2">

    <button onclick="calculateTip()">Calculate</button>

    <div class="results">
      <p><strong>Tip per person:</strong> <span id="tipPerPerson">0 FCFA</span></p>
      <p><strong>Total per person:</strong> <span id="totalPerPerson">0 FCFA</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
