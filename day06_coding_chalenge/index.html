<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Speech App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: orange;
    }

    textarea {
      width: 90%;
      max-width: 500px;
      height: 150px;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      outline: none;
      resize: none;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      background-color: orange;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ffb300;
    }
  </style>
</head>
<body>

  <h1>🗣️ Text to Speech</h1>
  <textarea id="text" placeholder="Type your text here..."></textarea>
  <button onclick="speakText()">Speak</button>

  <script>
    function speakText() {
      const text = document.getElementById("text").value;
      if (text.trim() === "") {
        alert("Please enter some text.");
        return;
      }

      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "en-US";
      speech.rate = 1;
      speech.pitch = 1;

      window.speechSynthesis.speak(speech);
    }
  </script>

</body>
</html>
