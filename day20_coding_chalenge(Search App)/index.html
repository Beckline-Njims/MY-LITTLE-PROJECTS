<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Country Search App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #search {
            width: 100%;
            padding: 12px 10px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        li img {
            width: 40px;
            height: 25px;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        .no-results {
            color: #999;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Country Search App</h1>
    <input type="text" id="search" placeholder="Search for a country..." />
    <ul id="results"></ul>

    <script>
        const searchInput = document.getElementById('search');
        const resultsList = document.getElementById('results');

        async function fetchCountries(query) {
            if (!query) {
                resultsList.innerHTML = '';
                return;
            }
            try {
                const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(query)}`);
                if (!response.ok) {
                    // If not found, clear and show no results
                    resultsList.innerHTML = '<li class="no-results">No results found.</li>';
                    return;
                }
                const countries = await response.json();
                displayResults(countries);
            } catch (error) {
                resultsList.innerHTML = '<li class="no-results">Error fetching data. Try again later.</li>';
            }
        }

        function displayResults(countries) {
            resultsList.innerHTML = '';
            countries.forEach(country => {
                const li = document.createElement('li');
                li.innerHTML = `
          <img src="${country.flags.svg}" alt="Flag of ${country.name.common}" />
          <span>${country.name.common}</span>
        `;
                resultsList.appendChild(li);
            });
        }

        // Debounce to reduce API calls
        let debounceTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = searchInput.value.trim();
            debounceTimeout = setTimeout(() => {
                fetchCountries(query);
            }, 300);
        });
    </script>
</body>

</html>
