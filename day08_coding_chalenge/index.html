<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Modal Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Button */
        button {
            background-color: lightblue;
            color: black;
            padding: 15px 30px;
            border: none;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Modal background */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* Modal box */
        .modal {
            background-color: #fff;
            color: #111;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .modal button {
            margin-top: 20px;
            background: #ff4d4d;
            color: white;
        }
    </style>
</head>

<body>

    <button onclick="openModal()">Open Modal</button>

    <!-- Modal Structure -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Hello 👋</h2>
            <p>This is a modal popup message!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>

</body>

</html>
