<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Card UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">Responsive Card UI</h1>

    <div class="card-container">
        <div class="card">
            <img src="./images/img1.jpg" alt="Card Image">
            <h2>Card Title</h2>
            <p>This is a sample description for the card. It's concise and informative.</p>
            <a href="#" class="btn">Learn More</a>
        </div>

        <div class="card">
            <img src="./images/img1.jpg" alt="Card Image">
            <h2>Another Title</h2>
            <p>This card uses clean UI principles and scales on all devices.</p>
            <a href="#" class="btn">Explore</a>
        </div>

        <div class="card">
            <img src="./images/img1.jpg" alt="Card Image">
            <h2>More Cards</h2>
            <p>Use cards for blogs, products, portfolios and more.</p>
            <a href="#" class="btn">Read More</a>
        </div>
    </div>

</body>

</html>
