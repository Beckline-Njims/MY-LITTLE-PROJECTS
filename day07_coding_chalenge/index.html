<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: lightblue;
            margin-bottom: 20px;
        }

        .choices {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: rgb(37, 37, 233);
            color: #111;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgb(92, 92, 204);
        }

        .result {
            font-size: 24px;
            margin-top: 20px;
        }

        .scoreboard {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>✊ Rock ✋ Paper ✌️ Scissors</h1>

    <div class="choices">
        <button onclick="play('rock')">✊ Rock</button>
        <button onclick="play('paper')">✋ Paper</button>
        <button onclick="play('scissors')">✌️ Scissors</button>
    </div>

    <div class="result" id="resultText">Make your move!</div>
    <div class="scoreboard" id="score">You: 0 | Computer: 0</div>

    <script>
        let userScore = 0;
        let computerScore = 0;

        function play(userChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            let result = '';

            if (userChoice === computerChoice) {
                result = "It's a draw! 🤝";
            } else if (
                (userChoice === 'rock' && computerChoice === 'scissors') ||
                (userChoice === 'paper' && computerChoice === 'rock') ||
                (userChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = `You Win! 🎉 ${userChoice} beats ${computerChoice}`;
                userScore++;
            } else {
                result = `You Lose! 😢 ${computerChoice} beats ${userChoice}`;
                computerScore++;
            }

            document.getElementById("resultText").textContent = result;
            document.getElementById("score").textContent = `You: ${userScore} | Computer: ${computerScore}`;
        }
    </script>

</body>

</html>
